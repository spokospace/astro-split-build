<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>astro-split-build: build each locale in turn, merge, run the enabled checks in one pass, then deploy only on success</title>
<rect width="760" height="440" rx="12" fill="#0d1117"/>
<text x="380" y="18" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle" dominant-baseline="central">One locale per run, one run after another: each build holds a third of the site</text>
<rect x="20" y="40" width="200" height="64" rx="8" fill="#2b1a3a" stroke="#bc52ee" stroke-width="1"/>
<text x="120" y="62" font-size="15" font-weight="600" fill="#ecc8fb" text-anchor="middle" dominant-baseline="central">astro build: en</text>
<text x="120" y="84" font-size="13" font-weight="400" fill="#ecc8fb" text-anchor="middle" dominant-baseline="central">copied whole, as the root</text>
<rect x="280" y="40" width="200" height="64" rx="8" fill="#2b1a3a" stroke="#bc52ee" stroke-width="1"/>
<text x="380" y="62" font-size="15" font-weight="600" fill="#ecc8fb" text-anchor="middle" dominant-baseline="central">astro build: pl</text>
<text x="380" y="84" font-size="13" font-weight="400" fill="#ecc8fb" text-anchor="middle" dominant-baseline="central">only its pl/ is kept</text>
<rect x="540" y="40" width="200" height="64" rx="8" fill="#2b1a3a" stroke="#bc52ee" stroke-width="1"/>
<text x="640" y="62" font-size="15" font-weight="600" fill="#ecc8fb" text-anchor="middle" dominant-baseline="central">astro build: de</text>
<text x="640" y="84" font-size="13" font-weight="400" fill="#ecc8fb" text-anchor="middle" dominant-baseline="central">only its de/ is kept</text>
<line x1="222" y1="72" x2="276" y2="72" stroke="#6e7681" stroke-width="1.5"/>
<path d="M269.0 75.8 L276 72 L269.0 68.2" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="482" y1="72" x2="536" y2="72" stroke="#6e7681" stroke-width="1.5"/>
<path d="M529.0 75.8 L536 72 L529.0 68.2" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="120" y1="106" x2="120" y2="142" stroke="#6e7681" stroke-width="1.5"/>
<path d="M116.2 135.0 L120 142 L123.8 135.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="380" y1="106" x2="380" y2="142" stroke="#6e7681" stroke-width="1.5"/>
<path d="M376.2 135.0 L380 142 L383.8 135.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="640" y1="106" x2="640" y2="142" stroke="#6e7681" stroke-width="1.5"/>
<path d="M636.2 135.0 L640 142 L643.8 135.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="146" width="720" height="64" rx="8" fill="#171c4d" stroke="#6b78ff" stroke-width="1"/>
<text x="380" y="168" font-size="15" font-weight="600" fill="#ced3ff" text-anchor="middle" dominant-baseline="central">Merge into one dist/</text>
<text x="380" y="190" font-size="13" font-weight="400" fill="#ced3ff" text-anchor="middle" dominant-baseline="central">en at the root, pl/ and de/ under it, every _astro/ bundle of every build kept</text>
<line x1="380" y1="212" x2="380" y2="248" stroke="#6e7681" stroke-width="1.5"/>
<path d="M376.2 241.0 L380 248 L383.8 241.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="252" width="720" height="64" rx="8" fill="#171c4d" stroke="#6b78ff" stroke-width="1"/>
<text x="380" y="274" font-size="15" font-weight="600" fill="#ced3ff" text-anchor="middle" dominant-baseline="central">The checks you enable, in one pass over the pages</text>
<text x="380" y="296" font-size="13" font-weight="400" fill="#ced3ff" text-anchor="middle" dominant-baseline="central">bundles, internal links, canonicals, hreflang both ways, your own page checks</text>
<line x1="195" y1="318" x2="195" y2="354" stroke="#6e7681" stroke-width="1.5"/>
<path d="M191.2 347.0 L195 354 L198.8 347.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="565" y1="318" x2="565" y2="354" stroke="#6e7681" stroke-width="1.5"/>
<path d="M561.2 347.0 L565 354 L568.8 347.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="358" width="350" height="64" rx="8" fill="#0f2d1a" stroke="#3fb950" stroke-width="1"/>
<text x="195" y="380" font-size="15" font-weight="600" fill="#aff5b4" text-anchor="middle" dominant-baseline="central">Every check passes</text>
<text x="195" y="402" font-size="13" font-weight="400" fill="#aff5b4" text-anchor="middle" dominant-baseline="central">exit 0: deploy the merged dist/</text>
<rect x="390" y="358" width="350" height="64" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
<text x="565" y="380" font-size="15" font-weight="600" fill="#d1d9e0" text-anchor="middle" dominant-baseline="central">A check fails</text>
<text x="565" y="402" font-size="13" font-weight="400" fill="#d1d9e0" text-anchor="middle" dominant-baseline="central">exit 1: deploy nothing, keep the live release</text>
</svg>
