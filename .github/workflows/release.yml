name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # registry-url is deliberately absent: it makes setup-node write an
      # .npmrc auth line with an empty token, and npm then never starts the
      # OIDC exchange (ENEEDAUTH / E404). See actions/setup-node#1551.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # TypeScript, for the .d.ts files `npm publish` builds (prepare).
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

      # npm auth comes from the trusted publisher configured for
      # astro-split-build on npmjs.com: @semantic-release/npm exchanges the
      # Actions OIDC token (id-token: write, above) for a short-lived
      # credential, so there is no NPM_TOKEN secret to expire. Node 24 ships
      # npm 11, past the 11.5.1 trusted-publishing minimum.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release@25.0.9
